# Пробник прода: дёргает ключевые URL и печатает статусы в лог.
# Запускается на каждый push в main — лог читается через API.
name: probe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe production
        run: |
          for host in cyclefit-liard.vercel.app; do
            for path in /api/health /api/plans / /admin; do
              url="https://$host$path"
              code=$(curl -s -o /tmp/body -w "%{http_code}" --max-time 20 "$url" || echo "ERR")
              echo "== $url → $code"
              head -c 300 /tmp/body; echo; echo
            done
          done
