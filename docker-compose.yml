services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: cyclefit
      POSTGRES_PASSWORD: cyclefit
      POSTGRES_DB: cyclefit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyclefit"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://cyclefit:cyclefit@postgres:5432/cyclefit
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/apps/backend/uploads
    ports:
      - "3000:3000"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./apps/miniapp/dist:/usr/share/nginx/miniapp:ro
      - ./apps/admin/dist:/usr/share/nginx/admin:ro
    ports:
      - "8080:80"

volumes:
  pgdata:
  uploads:
